version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: time-tracking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-time_tracking}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracking"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: time-tracking-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-timetracking}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-time_tracking}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: time-tracking-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:

networks:
  default:
    name: time-tracking
