# Serves the tool at https://time-tracking.local, so other apps in the cluster can have
# their own host instead of a port. Everything goes to the frontend; its nginx proxies /api and
# /health to the backend (frontend/nginx.conf), so the backend has no route here. Needs an ingress controller with the class "nginx"
# (see k8s/README.md), time-tracking.local pointing to 127.0.0.1 and ::1 in /etc/hosts and
# the Secret time-tracking-tls from k8s/setup-tls.sh. Plain http is redirected to https.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: time-tracking
  namespace: time-tracking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - time-tracking.local
    secretName: time-tracking-tls
  rules:
  - host: time-tracking.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
