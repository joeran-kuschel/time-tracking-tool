apiVersion: v1
kind: ConfigMap
metadata:
  name: time-tracking-config
  namespace: time-tracking
data:
  DATABASE_URL: "postgresql://timetracking:password@postgres:5432/time_tracking"
  NODE_ENV: "production"
  VITE_API_URL: "http://localhost:3000/api"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: time-tracking
type: Opaque
stringData:
  POSTGRES_USER: timetracking
  POSTGRES_PASSWORD: password
  POSTGRES_DB: time_tracking
