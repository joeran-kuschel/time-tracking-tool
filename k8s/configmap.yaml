apiVersion: v1
kind: ConfigMap
metadata:
  name: time-tracking-config
  namespace: time-tracking
data:
  NODE_ENV: "production"
  # "true" for remote databases that require SSL, "false" for the in-cluster Postgres
  DB_SSL: "false"
  # Addresses the frontend is opened at, comma-separated; only these may use the API from a browser.
  # Set per install, together with the host in ingress.yaml (e.g. "https://zeit.example.de").
  CORS_ORIGIN: "https://time-tracking.local"

---
apiVersion: v1
kind: Secret
metadata:
  name: time-tracking-db
  namespace: time-tracking
type: Opaque
stringData:
  # Replace with the remote connection string to use an external database
  DATABASE_URL: "postgresql://timetracking:password@postgres:5432/time_tracking"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: time-tracking
type: Opaque
stringData:
  POSTGRES_USER: timetracking
  POSTGRES_PASSWORD: password
  POSTGRES_DB: time_tracking
