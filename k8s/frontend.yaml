apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: time-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: time-tracking-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: time-tracking
spec:
  # Reached through the Ingress (ingress.yaml), not published on the host
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend
