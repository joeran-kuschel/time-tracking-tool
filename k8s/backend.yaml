apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: time-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: time-tracking-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: time-tracking-config
        - secretRef:
            name: time-tracking-db
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        # The same database as the backend: from the DATABASE_URL Secret, in the cluster or remote.
        # pg_isready only prints host and port, never the password.
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: time-tracking-db
              key: DATABASE_URL
        command:
        - sh
        - -c
        - |
          until pg_isready -d "$DATABASE_URL"; do
            echo 'Waiting for PostgreSQL...'
            sleep 1
          done

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: time-tracking
spec:
  # Reached by the frontend's nginx (/api and /health, frontend/nginx.conf), only from the
  # frontend pods (network-policy-backend.yaml); not published on the host
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: backend
