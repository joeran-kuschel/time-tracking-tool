# Generated by k8s/generate-init-scripts.sh from backend/migrations. Do not edit.
apiVersion: v1
data:
  001_init_schema.sql: |
    -- Customers table
    CREATE TABLE IF NOT EXISTS customers (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Projects table
    CREATE TABLE IF NOT EXISTS projects (
      id SERIAL PRIMARY KEY,
      customer_id INTEGER NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
      name VARCHAR(255) NOT NULL,
      hourly_rate DECIMAL(10, 2) DEFAULT 0.00,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Time entries table
    CREATE TABLE IF NOT EXISTS time_entries (
      id SERIAL PRIMARY KEY,
      project_id INTEGER NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      start_time TIMESTAMP NOT NULL,
      end_time TIMESTAMP,
      description TEXT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes for common queries
    CREATE INDEX IF NOT EXISTS idx_projects_customer_id ON projects(customer_id);
    CREATE INDEX IF NOT EXISTS idx_time_entries_project_id ON time_entries(project_id);
    CREATE INDEX IF NOT EXISTS idx_time_entries_start_time ON time_entries(start_time);
  002_report_status.sql: |
    -- Status of a customer's monthly report. A missing row means draft.
    CREATE TABLE IF NOT EXISTS report_status (
      customer_id INTEGER NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
      year INTEGER NOT NULL,
      month INTEGER NOT NULL CHECK (month BETWEEN 1 AND 12),
      status VARCHAR(10) NOT NULL CHECK (status IN ('draft', 'ready', 'sent')),
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (customer_id, year, month)
    );
  003_one_running_timer.sql: |
    -- Only one timer may run at a time: at most one time entry without an end.
    -- The backend checks this before starting a timer; the index also stops two requests that arrive at once.
    CREATE UNIQUE INDEX IF NOT EXISTS one_running_timer ON time_entries ((end_time IS NULL)) WHERE end_time IS NULL;
  004_auth.sql: |
    -- The user of the tool and their login sessions. The email is stored in lower case.
    -- A session is identified by the SHA-256 hash of the token in the cookie, so a leaked database or backup
    -- doesn't contain a usable token. expires_at is the idle expiry and moves forward while the session is used.
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      email VARCHAR(255) NOT NULL UNIQUE,
      password_hash TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS sessions (
      token_hash VARCHAR(64) PRIMARY KEY,
      user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      created_at TIMESTAMP NOT NULL,
      expires_at TIMESTAMP NOT NULL
    );
    CREATE INDEX IF NOT EXISTS sessions_user_id ON sessions (user_id);
  005_settings.sql: |
    -- App-wide settings: one row (id is always 1), one typed column per option. The row is created on the first
    -- read (models/Settings.js), so every option has its default until it is saved. There are no options yet; each one adds a
    -- column with a default.
    CREATE TABLE IF NOT EXISTS settings (
      id SMALLINT PRIMARY KEY DEFAULT 1 CHECK (id = 1),
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
  006_settings_show_amounts.sql: |
    -- Setting: whether reports show hourly rates and amounts by default (the Reports page starts from it). Off by default.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS show_amounts BOOLEAN NOT NULL DEFAULT false;
  007_settings_rounding.sql: |
    -- Settings: rounding of the hours of an entry in reports. rounding_minutes is the step (0 = no rounding, the default),
    -- rounding_direction is 'up' (the default) or 'nearest'. show_rounding_note says whether reports name the rule in a
    -- sentence (off by default). Stored entries are never changed.
    -- The checks have explicit names so a later migration can replace them. 007 first allowed the steps 0, 15 and 30; a fresh
    -- install gets the steps of 008 (0, 5, 10, 15, 30, 60) right away, and 008 brings an install that applied the first
    -- version to the same state.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS rounding_minutes SMALLINT NOT NULL DEFAULT 0
      CONSTRAINT settings_rounding_minutes_check CHECK (rounding_minutes IN (0, 5, 10, 15, 30, 60));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS rounding_direction VARCHAR(7) NOT NULL DEFAULT 'up'
      CONSTRAINT settings_rounding_direction_check CHECK (rounding_direction IN ('up', 'nearest'));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS show_rounding_note BOOLEAN NOT NULL DEFAULT false;
  008_settings_rounding_steps.sql: |
    -- Rounding steps of 5, 10 and 60 minutes next to 15 and 30 (#77). An install that applied the first version of 007 has
    -- the check with the steps 0, 15 and 30: it is replaced. A fresh install already has this check from 007 and gets it
    -- again, so the statements can run on any state. Both statements run in one transaction, so the table is never left
    -- without the check. Needs 007 (the column).
    BEGIN;
    ALTER TABLE settings DROP CONSTRAINT IF EXISTS settings_rounding_minutes_check;
    ALTER TABLE settings ADD CONSTRAINT settings_rounding_minutes_check CHECK (rounding_minutes IN (0, 5, 10, 15, 30, 60));
    COMMIT;
kind: ConfigMap
