# Generated by k8s/generate-init-scripts.sh from backend/migrations. Do not edit.
apiVersion: v1
data:
  001_init_schema.sql: |
    -- Customers table
    CREATE TABLE IF NOT EXISTS customers (
      id SERIAL PRIMARY KEY,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Projects table
    CREATE TABLE IF NOT EXISTS projects (
      id SERIAL PRIMARY KEY,
      customer_id INTEGER NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
      name VARCHAR(255) NOT NULL,
      hourly_rate DECIMAL(10, 2) DEFAULT 0.00,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Time entries table
    CREATE TABLE IF NOT EXISTS time_entries (
      id SERIAL PRIMARY KEY,
      project_id INTEGER NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
      start_time TIMESTAMP NOT NULL,
      end_time TIMESTAMP,
      description TEXT,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes for common queries
    CREATE INDEX IF NOT EXISTS idx_projects_customer_id ON projects(customer_id);
    CREATE INDEX IF NOT EXISTS idx_time_entries_project_id ON time_entries(project_id);
    CREATE INDEX IF NOT EXISTS idx_time_entries_start_time ON time_entries(start_time);
  002_report_status.sql: |
    -- Status of a customer's monthly report. A missing row means draft.
    CREATE TABLE IF NOT EXISTS report_status (
      customer_id INTEGER NOT NULL REFERENCES customers(id) ON DELETE CASCADE,
      year INTEGER NOT NULL,
      month INTEGER NOT NULL CHECK (month BETWEEN 1 AND 12),
      status VARCHAR(10) NOT NULL CHECK (status IN ('draft', 'ready', 'sent')),
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (customer_id, year, month)
    );
  003_one_running_timer.sql: |
    -- Only one timer may run at a time: at most one time entry without an end.
    -- The backend checks this before starting a timer; the index also stops two requests that arrive at once.
    CREATE UNIQUE INDEX IF NOT EXISTS one_running_timer ON time_entries ((end_time IS NULL)) WHERE end_time IS NULL;
  004_auth.sql: |
    -- The user of the tool and their login sessions. The email is stored in lower case.
    -- A session is identified by the SHA-256 hash of the token in the cookie, so a leaked database or backup
    -- doesn't contain a usable token. expires_at is the idle expiry and moves forward while the session is used.
    CREATE TABLE IF NOT EXISTS users (
      id SERIAL PRIMARY KEY,
      email VARCHAR(255) NOT NULL UNIQUE,
      password_hash TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS sessions (
      token_hash VARCHAR(64) PRIMARY KEY,
      user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      created_at TIMESTAMP NOT NULL,
      expires_at TIMESTAMP NOT NULL
    );
    CREATE INDEX IF NOT EXISTS sessions_user_id ON sessions (user_id);
  005_settings.sql: |
    -- App-wide settings: one row (id is always 1), one typed column per option. The row is created on the first
    -- read (models/Settings.js), so every option has its default until it is saved. There are no options yet; each one adds a
    -- column with a default.
    CREATE TABLE IF NOT EXISTS settings (
      id SMALLINT PRIMARY KEY DEFAULT 1 CHECK (id = 1),
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
  006_settings_show_amounts.sql: |
    -- Setting: whether reports show hourly rates and amounts by default (the Reports page starts from it). Off by default.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS show_amounts BOOLEAN NOT NULL DEFAULT false;
  007_settings_rounding.sql: |
    -- Settings: rounding of the hours of an entry in reports. rounding_minutes is the step (0 = no rounding, the default),
    -- rounding_direction is 'up' (the default) or 'nearest'. show_rounding_note says whether reports name the rule in a
    -- sentence (off by default). Stored entries are never changed.
    -- The checks have explicit names so a later migration can replace them. 007 first allowed the steps 0, 15 and 30; a fresh
    -- install gets the steps of 008 (0, 5, 10, 15, 30, 60) right away, and 008 brings an install that applied the first
    -- version to the same state.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS rounding_minutes SMALLINT NOT NULL DEFAULT 0
      CONSTRAINT settings_rounding_minutes_check CHECK (rounding_minutes IN (0, 5, 10, 15, 30, 60));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS rounding_direction VARCHAR(7) NOT NULL DEFAULT 'up'
      CONSTRAINT settings_rounding_direction_check CHECK (rounding_direction IN ('up', 'nearest'));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS show_rounding_note BOOLEAN NOT NULL DEFAULT false;
  008_settings_rounding_steps.sql: |
    -- Rounding steps of 5, 10 and 60 minutes next to 15 and 30 (#77). An install that applied the first version of 007 has
    -- the check with the steps 0, 15 and 30: it is replaced. A fresh install already has this check from 007 and gets it
    -- again, so the statements can run on any state. Both statements run in one transaction, so the table is never left
    -- without the check. Needs 007 (the column).
    BEGIN;
    ALTER TABLE settings DROP CONSTRAINT IF EXISTS settings_rounding_minutes_check;
    ALTER TABLE settings ADD CONSTRAINT settings_rounding_minutes_check CHECK (rounding_minutes IN (0, 5, 10, 15, 30, 60));
    COMMIT;
  009_customer_rounding.sql: |
    -- Customers: an own rounding rule that overrides the global setting (#77). Both columns empty means "use the global
    -- setting" (every existing customer); rounding_minutes 0 means no rounding for this customer (rounding_direction is then
    -- 'up' and not used). The steps are those of settings.rounding_minutes (migration 008): the list is in both checks, so a
    -- migration that adds a step has to replace customers_rounding_minutes_check too. The checks have explicit names and allow
    -- NULL explicitly (pg-mem, the test database, would otherwise refuse a NULL in an IN check). One transaction, so a failing
    -- statement leaves nothing half done; every statement can run again.
    BEGIN;
    ALTER TABLE customers ADD COLUMN IF NOT EXISTS rounding_minutes SMALLINT
      CONSTRAINT customers_rounding_minutes_check CHECK (rounding_minutes IS NULL OR rounding_minutes IN (0, 5, 10, 15, 30, 60));
    ALTER TABLE customers ADD COLUMN IF NOT EXISTS rounding_direction VARCHAR(7)
      CONSTRAINT customers_rounding_direction_check CHECK (rounding_direction IS NULL OR rounding_direction IN ('up', 'nearest'));
    ALTER TABLE customers DROP CONSTRAINT IF EXISTS customers_rounding_both_or_none_check;
    ALTER TABLE customers ADD CONSTRAINT customers_rounding_both_or_none_check
      CHECK ((rounding_minutes IS NULL) = (rounding_direction IS NULL));
    COMMIT;
  010_settings_default_hourly_rate.sql: |
    -- Settings: the hourly rate a new project starts with, in euros. NULL (the default) means no default rate. It is only
    -- read when the form for a new project opens; existing projects and report amounts never change with it.
    -- The check is added separately (and replaced when the migration runs again) so that it can run twice.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS default_hourly_rate DECIMAL(10, 2);
    ALTER TABLE settings DROP CONSTRAINT IF EXISTS settings_default_hourly_rate_check;
    ALTER TABLE settings ADD CONSTRAINT settings_default_hourly_rate_check CHECK (default_hourly_rate >= 0);
  011_customer_report_language.sql: |
    -- Customers: the language of their PDF and CSV reports (#82). NULL (every existing customer) means the language of the
    -- app at download time, as before; 'de' or 'en' makes the customer's reports always come out in that language.
    -- The list of languages is LOCALES in backend/src/i18n.js; a migration that adds one replaces the check. The check has an
    -- explicit name, allows NULL explicitly, and is added separately (replaced when the migration runs again), so that the
    -- migration can run twice and pg-mem, the test database, accepts it.
    ALTER TABLE customers ADD COLUMN IF NOT EXISTS report_language VARCHAR(2);
    ALTER TABLE customers DROP CONSTRAINT IF EXISTS customers_report_language_check;
    ALTER TABLE customers ADD CONSTRAINT customers_report_language_check
      CHECK (report_language IS NULL OR report_language IN ('de', 'en'));
  012_settings_week_start.sql: |
    -- Settings: the first day of the week, 'monday' (the default) or 'sunday'. The Dashboard and the Entries filters start
    -- their weeks on this day. Months and reports stay calendar months. Stored entries never change.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS week_start VARCHAR(6) NOT NULL DEFAULT 'monday'
      CONSTRAINT settings_week_start_check CHECK (week_start IN ('monday', 'sunday'));
  013_settings_sender_details.sql: |
    -- Settings: your own details, printed in the sender block of the PDF report. All three are empty (NULL) by default,
    -- and a report without details looks as before. The address can have several lines.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS sender_name VARCHAR(100);
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS sender_address VARCHAR(300);
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS sender_email VARCHAR(254);
  014_sender_logo.sql: |
    -- Your logo for the sender block of the PDF report: one row (id is always 1), the image itself (PNG or JPEG, checked by
    -- the backend before it is stored) and its type. It has its own table, not a column of settings, so that reading the
    -- settings never loads the image. No row means no logo. The hourly backup includes the table.
    CREATE TABLE IF NOT EXISTS sender_logo (
      id SMALLINT PRIMARY KEY DEFAULT 1 CONSTRAINT sender_logo_single_row CHECK (id = 1),
      content_type VARCHAR(10) NOT NULL CONSTRAINT sender_logo_type_check CHECK (content_type IN ('image/png', 'image/jpeg')),
      data BYTEA NOT NULL,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
  015_settings_invoicing.sql: |
    -- Settings for invoices: VAT ('regular' with a rate of 19, 7 or 0 percent, or 'small_business' under §19 UStG, which
    -- charges none), your own tax ID (NULL = not set), and the pattern of the invoice numbers with {YYYY}, {YY}, {MM} and one
    -- counter such as {NNNN} (checked by the backend, see utils/invoiceNumber.js). Nothing uses them until invoices exist.
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS vat_mode VARCHAR(14) NOT NULL DEFAULT 'regular'
      CONSTRAINT settings_vat_mode_check CHECK (vat_mode IN ('regular', 'small_business'));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS vat_rate SMALLINT NOT NULL DEFAULT 19
      CONSTRAINT settings_vat_rate_check CHECK (vat_rate IN (0, 7, 19));
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS sender_tax_id VARCHAR(30);
    ALTER TABLE settings ADD COLUMN IF NOT EXISTS invoice_number_pattern VARCHAR(40) NOT NULL DEFAULT '{YYYY}-{NNNN}';

    -- The next invoice number per counter. scope_year is the year a counter belongs to, or 0 for a pattern without a year,
    -- which keeps counting. A year without a row starts at 1. Numbers are only ever raised.
    CREATE TABLE IF NOT EXISTS invoice_counters (
      scope_year SMALLINT PRIMARY KEY CONSTRAINT invoice_counters_year_check CHECK (scope_year = 0 OR scope_year BETWEEN 1000 AND 9999),
      next_number INTEGER NOT NULL DEFAULT 1 CONSTRAINT invoice_counters_number_check CHECK (next_number BETWEEN 1 AND 99999999),
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: time-tracking
