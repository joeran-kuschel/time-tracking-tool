events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    index index.html;

    # The backend is reached only through here; ^~ keeps the static-file regex below from winning
    location ^~ /api/ {
      proxy_pass http://backend:3000;
      proxy_set_header Host $host;
    }

    location = /health {
      proxy_pass http://backend:3000;
      proxy_set_header Host $host;
    }

    # The page itself is never cached for long (no hash in its name): after a deploy a reload must fetch the new
    # build. Unknown paths and deep links are answered by the fallback below with this same location; `always` also
    # covers the 404 that a missing file gets from `error_page`, so a stale chunk request never caches the index page
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
  }
}
